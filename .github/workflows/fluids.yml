name: fluids
on:
  push:
    branches:
      - research/fluids-blood
  pull_request:
    paths:
      - "fluid/**"
      - "blood/**"
      - ".github/workflows/fluids.yml"

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make git glslang-tools libvulkan-dev
          git clone --depth 1 https://github.com/xt9y/build.c.git /tmp/cbuild
          make -C /tmp/cbuild
          sudo make -C /tmp/cbuild install
      - name: Compile GLSL
        run: |
          glslangValidator -V fluid/fld/shaders/surface.comp -o /tmp/fluid.spv
          glslangValidator -V -Iblood/bld/shaders tests/blood_shader.frag -o /tmp/blood.frag.spv
      - name: Configure private sibling dependencies
        env:
          DEPENDENCY_TOKEN: ${{ secrets.VULKAN_DEPS_TOKEN }}
        run: |
          if [ -z "$DEPENDENCY_TOKEN" ]; then
            echo "::error::VULKAN_DEPS_TOKEN with read access to xt9y/vulkan-engine and xt9y/vulkan-systems is required for independent library builds"
            exit 1
          fi
          git config --global url."https://x-access-token:${DEPENDENCY_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Build independent libraries
        run: |
          cd fluid
          c build
          cd ../blood
          c build
      - name: Standalone deterministic physics test
        run: |
          git clone --depth 1 https://github.com/xt9y/vulkan-engine.git /tmp/vkengine
          clang++ -std=c++17 -O2 -I/tmp/vkengine \
            tests/fluid_physics.cpp \
            fluid/fld/core/system.cpp \
            fluid/fld/material/rheology.cpp \
            fluid/fld/material/contact.cpp \
            fluid/fld/math/kernels.cpp \
            fluid/fld/simulation/grid.cpp \
            fluid/fld/simulation/solver.cpp \
            -o /tmp/fluid_physics
          /tmp/fluid_physics
      - name: Persistent clothing atlas regression
        run: |
          clang++ -std=c++17 -O2 -I/tmp/vkengine -I fluid -I blood \
            tests/blood_atlas.cpp \
            blood/bld/surfaces/stains.cpp \
            blood/bld/material/blood.cpp \
            fluid/fld/material/rheology.cpp \
            fluid/fld/math/kernels.cpp \
            -o /tmp/blood_atlas
          /tmp/blood_atlas
