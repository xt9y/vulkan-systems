name: fluids
on:
  push:
    branches:
      - research/fluids-blood
  pull_request:
    paths:
      - "fluid/**"
      - "blood/**"
      - ".github/workflows/fluids.yml"

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make git glslang-tools libvulkan-dev
          git clone --depth 1 https://github.com/xt9y/build.c.git /tmp/cbuild
          make -C /tmp/cbuild
          sudo make -C /tmp/cbuild install
      - name: Build independent libraries
        run: |
          cd fluid
          c build
          cd ../blood
          c build
      - name: Compile GLSL
        run: |
          glslangValidator -V fluid/fld/shaders/surface.comp -o /tmp/fluid.spv
      - name: Standalone deterministic physics test
        run: |
          git clone --depth 1 https://github.com/xt9y/vulkan-engine.git /tmp/vkengine
          clang++ -std=c++17 -O2 -I/tmp/vkengine \
            tests/fluid_physics.cpp \
            fluid/fld/core/system.cpp \
            fluid/fld/material/rheology.cpp \
            fluid/fld/material/contact.cpp \
            fluid/fld/math/kernels.cpp \
            fluid/fld/simulation/grid.cpp \
            fluid/fld/simulation/solver.cpp \
            -o /tmp/fluid_physics
          /tmp/fluid_physics
