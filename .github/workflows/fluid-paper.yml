name: fluid-paper
on:
  push:
    branches:
      - main
      - paper/scale-aware-fluid-2026
    paths:
      - "fluid/paper/**"
      - ".github/workflows/fluid-paper.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout paper source
        uses: actions/checkout@v4
      - name: Compile authorless LaTeX manuscript
        uses: xu-cheng/latex-action@v4
        with:
          root_file: fluid-paper.tex
          working_directory: fluid/paper
          os: debian
          texlive_version: 2026
      - name: Upload compiled paper
        uses: actions/upload-artifact@v4
        with:
          name: vulkanfluid-paper
          path: fluid/paper/fluid-paper.pdf
          if-no-files-found: error
      - name: Commit compiled PDF to the paper directory
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f fluid/paper/fluid-paper.pdf
          if git diff --cached --quiet; then
            echo "PDF is already current"
          else
            git commit -m "paper: rebuild compiled manuscript"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
